name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue data and claims register
        run: node tools/validate.mjs
      - name: Build bundles and site
        run: python3 tools/build.py --site --stamp "ci-${GITHUB_SHA::7}"
