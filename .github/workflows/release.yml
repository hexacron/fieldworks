name: Release

# Push a tag like v2026.10.0 to publish a GitHub Release with both single-file builds attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tools/validate.mjs
      - run: python3 tools/build.py --stamp "${GITHUB_REF_NAME} · $(date -u +%F)" --site-url "${{ vars.SITE_URL || 'https://hexacron.github.io/fieldworks' }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fieldguide.html dist/quarry.html \
            --title "fieldworks $GITHUB_REF_NAME" --generate-notes
